[package]
name = "vole-gfx"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "VOLE-GFX: deterministic procedural visual state as a graphics intermediate representation. One crate: exact U1 semantics (vole.gfx.u1), canonical IR, scalar/blocked/AVX2/AVX-512/Rayon/CUDA materializers, seeded procedural generator fields with direct seeded evaluation, scalar+SIMD (AVX2/AVX-512) inverse procedural compiler: unbaking with exact search-work accounting, seeded-field seed sweeps, Pareto frontiers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/vole-gfx"
keywords = ["procedural", "graphics", "materialization", "ir", "deterministic"]
categories = ["graphics", "multimedia::encoding", "science"]

# ---------------------------------------------------------------------------
# Dependency policy (one crate):
#  - host CUDA driver binding (libloading -> libcuda) and Vulkan are OPTIONAL
#    features so that plain CPU builds need no external graphics SDKs.
#  - cudarc / ash are only added via `cargo add` when the corresponding phase
#    actually lands and measurement justifies them; features exist now so
#    module cfg-gates are stable.
# ---------------------------------------------------------------------------

[dependencies]
clap = { version = "4", features = ["derive"] }
libloading = { version = "0.8", optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
# Host-side CUDA driver interaction via a narrow libloading binding to
# libcuda (the driver API). Device code itself is Rust PTX (cuda-device).
cuda = ["dep:libloading"]
# Compile the crate (or --lib with --no-default-features) as no_std device code
# for the nvptx64-nvidia-cuda target.
cuda-device = []
# Vulkan (ash) for experimental external-resource / display work.
vulkan = []
# Experimental direct-display (DRM/KMS + Vulkan display) prototype.
direct = ["vulkan"]
libloading = ["dep:libloading"]

[[example]]
name = "phase_g_gate"
required-features = ["cuda"]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4

[profile.bench]
debug = 0
lto = "thin"
